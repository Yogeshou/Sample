version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups:
      python-runtime: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: "/notify"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: "/terraform"
    schedule: { interval: weekly }
