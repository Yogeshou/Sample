# Project-specific Semgrep rules. They encode the bug classes found in this
# codebase's review so they can never silently come back (security regression
# guard-rails). Run alongside the public p/python, p/javascript, p/owasp-top-ten
# and p/secrets rulesets in CI.
rules:
  - id: jwt-decode-allows-none-algorithm
    languages: [python]
    severity: ERROR
    message: JWT decode accepts the 'none' algorithm - unsigned tokens will authenticate (auth bypass).
    metadata: { cwe: "CWE-347", owasp: "A02:2021", confidence: HIGH }
    pattern-either:
      - pattern: $JWT.decode(..., algorithms=[..., "none", ...], ...)
      - pattern: $JWT.decode(..., algorithms=[..., "None", ...], ...)

  - id: sqlalchemy-text-with-untrusted-input
    languages: [python]
    severity: ERROR
    mode: taint
    message: A function argument flows into a raw SQL string executed via text() - SQL injection. Use bound parameters or the ORM.
    metadata: { cwe: "CWE-89", owasp: "A03:2021", confidence: HIGH }
    pattern-sources:
      - patterns:
          - pattern-inside: |
              def $F(..., $Q, ...):
                ...
          - pattern: $Q
    pattern-sinks:
      - pattern: text(...)
    pattern-sanitizers:
      - pattern: bindparam(...)

  - id: password-written-to-log
    languages: [python]
    severity: ERROR
    message: A password/secret value is passed to a logger - credentials will be stored in log pipelines.
    metadata: { cwe: "CWE-532", owasp: "A09:2021", confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $OBJ.password, ...)
          - pattern: $LOG.$M(..., $OBJ.secret, ...)
          - pattern: $LOG.$M(..., password, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|warn|error|exception|critical)$

  - id: traceback-returned-to-client
    languages: [python]
    severity: WARNING
    message: Stack trace returned in an HTTP response - information disclosure.
    metadata: { cwe: "CWE-209", owasp: "A05:2021", confidence: HIGH }
    pattern: |
      JSONResponse(..., content={..., "traceback": traceback.format_exc(), ...}, ...)

  - id: cors-origin-reflected-with-credentials
    languages: [python]
    severity: WARNING
    message: Request Origin reflected into Access-Control-Allow-Origin together with credentials - any site can read responses.
    metadata: { cwe: "CWE-942", owasp: "A05:2021", confidence: HIGH }
    patterns:
      - pattern-inside: |
          $ORIGIN = $REQ.headers.get("origin")
          ...
      - pattern: $RESP.headers["Access-Control-Allow-Origin"] = $ORIGIN

  - id: url-built-from-request-host
    languages: [python]
    severity: WARNING
    message: Absolute URL built from the request Host header (request.base_url / url_for) - Host-header injection can poison links sent to third parties.
    metadata: { cwe: "CWE-644", owasp: "A05:2021", confidence: MEDIUM }
    pattern-either:
      - pattern: f"{$REQ.base_url}..."
      - pattern: str($REQ.base_url) + ...

  - id: hardcoded-credential-assignment
    languages: [python, javascript]
    severity: ERROR
    message: Credential-looking constant assigned a literal value - load it from the environment / secrets manager.
    metadata: { cwe: "CWE-798", owasp: "A07:2021", confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: "{..., $NAME: '$VALUE', ...}"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|password|passwd|api_key|apikey|service_key|token).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{8,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!bearer$).*

  - id: express-error-leaks-stack
    languages: [javascript]
    severity: WARNING
    message: Express error handler returns err.stack / err.message to the client - information disclosure.
    metadata: { cwe: "CWE-209", owasp: "A05:2021", confidence: HIGH }
    pattern-either:
      - pattern: "$RES.status(...).json({..., stack: $ERR.stack, ...})"
      - pattern: "$RES.json({..., stack: $ERR.stack, ...})"

  - id: express-route-without-auth-middleware
    languages: [javascript]
    severity: INFO
    message: Express app defines routes but registers no authentication middleware - review whether endpoints are meant to be public.
    metadata: { cwe: "CWE-306", owasp: "A07:2021", confidence: LOW }
    patterns:
      - pattern: app.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$
      - metavariable-regex:
          metavariable: $PATH
          regex: ^.(?!/health).*
      - pattern-not-inside: |
          app.use(($REQ, $RES, $NEXT) => { ... });
          ...

  - id: outbound-request-to-user-supplied-url
    languages: [javascript]
    severity: WARNING
    message: HTTP request to a URL that originates from user input (webhook registration) - SSRF. Validate scheme/host and block private ranges.
    metadata: { cwe: "CWE-918", owasp: "A10:2021", confidence: MEDIUM }
    patterns:
      - pattern: axios.post($HOOK.url, ...)
      - pattern-not-inside: |
          await assertPublicDestination($HOOK.url);
          ...
